<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دورة القراءة</title>
<meta property="og:type" content="website">
<meta property="og:title" content="دورة القراءة">
<meta property="og:description" content="اقرأ مع أصدقائك وتابع تقدّم الجميع يومياً">
<meta property="og:url" content="https://observer24434.github.io/reading-circle/">
<meta property="og:image" content="https://observer24434.github.io/reading-circle/dawra-logo.gif">
<meta property="og:image:type" content="image/gif">
<meta property="og:image:width" content="480">
<meta property="og:image:height" content="390">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://observer24434.github.io/reading-circle/dawra-logo.gif">
<meta name="theme-color" content="#7c5cff">
<style>
:root{--fg:#f4f1ff;--card:rgba(255,255,255,.09);--ac:#7c5cff;--ac2:#00d4b4;--mut:#bdb5e0;--bd:rgba(255,255,255,.18);--bad:#ff6b8a;--ok:#3ee6a8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#1b1340,#0f3d5e,#3a1b5e,#0b4a4a);background-size:300% 300%;background-attachment:fixed;animation:bg 20s ease infinite}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(0,212,180,.6)}50%{box-shadow:0 0 0 14px rgba(0,212,180,0)}}
@keyframes grow{from{width:0}}
#app{max-width:900px;margin:0 auto;padding:20px 16px 60px}
#app>*{animation:up .5s both}
h1,h2{text-align:center}
h1{font-size:2.2rem;background:linear-gradient(90deg,#a78bff,#00e0c0);-webkit-background-clip:text;background-clip:text;color:transparent}
h1 .fl{display:inline-block;animation:fl 3s ease-in-out infinite;-webkit-text-fill-color:initial}
.col{display:flex;flex-direction:column;gap:14px;max-width:420px;margin:24px auto}
.col>*{animation:up .5s both}.col>*:nth-child(2){animation-delay:.1s}.col>*:nth-child(3){animation-delay:.2s}.col>*:nth-child(4){animation-delay:.3s}
button{font:inherit;padding:14px 18px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 18px rgba(124,92,255,.35)}
button:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(0,212,180,.35)}
button:active{transform:scale(.97)}
button.ghost{background:rgba(255,255,255,.08);border:1px solid var(--bd);box-shadow:none}
button.danger{background:linear-gradient(135deg,#ff4d6d,#c9184a);box-shadow:0 6px 18px rgba(255,77,109,.35)}
button.ghost.danger{background:rgba(255,77,109,.12);border:1px solid rgba(255,77,109,.5);color:#ff9fb2;box-shadow:none}
button:disabled{opacity:.5;transform:none}
input,select{font:inherit;padding:12px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.1);color:var(--fg);width:100%;transition:border .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--ac2);box-shadow:0 0 0 3px rgba(0,212,180,.25)}
option{color:#000}
label{display:block;font-size:14px;color:var(--mut);margin:4px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .2s,border .2s}
.card:hover{transform:translateY(-4px) scale(1.02);border-color:var(--ac2)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:16px;overflow:hidden;backdrop-filter:blur(8px)}
tr{animation:up .5s both}
th,td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--bd);font-size:15px}
th{color:var(--mut);font-weight:500;font-size:13px}
.pb{height:7px;border-radius:7px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:6px}
.pb i{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,var(--ac),var(--ac2));animation:grow 1.2s ease}
.ok{color:var(--ok);display:inline-block;animation:pop .6s}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:12px 0}
.bar button{padding:10px 14px}
.cv{text-align:center;overflow-x:auto}
canvas{max-width:100%;border-radius:10px;background:#fff;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#fin{animation:pulse 2s infinite}
.mut{color:var(--mut);text-align:center}
.bad{color:var(--bad)}
.mod{position:fixed;inset:0;background:rgba(5,3,20,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9;animation:up .3s}
.box{background:#251a52;border:1px solid var(--bd);border-radius:18px;padding:20px;width:100%;max-width:380px}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WORKER='https://dawra-api2.observer-only.workers.dev';
const mine=()=>JSON.parse(localStorage.mine||'[]');
const remember=(d,n)=>{const l=mine().filter(x=>x.d!==d);l.push({d,n});localStorage.mine=JSON.stringify(l)};
const slug=s=>[...new TextEncoder().encode(s.trim().toLowerCase())].map(b=>b.toString(16).padStart(2,'0')).join('');
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64file=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const busy=x=>app.innerHTML=`<p class="mut">${x||tr('loading')}</p>`;
const T={
ar:{title:'دورة القراءة',loading:'جاري التحميل...',menu_back:'← القائمة',create:'إنشاء دورة',join:'الانضمام إلى دورة',mine:'دوراتك',lang_btn:'🌐 اللغة · Language',
name_lbl:'اسم الدورة',pages_lbl:'عدد الصفحات في اليوم',me_lbl:'اسمك في الدورة',pdf_lbl:'ملف PDF',code_lbl:'رمز حذف الدورة (احفظه، تحتاجه لحذفها)',create_btn:'إنشاء',
fill_all:'عبّ كل الحقول',uploading:'جاري الرفع...',dup:'فيه دورة بنفس الاسم، اختر اسم ثاني',circle_lbl:'الدورة',join_btn:'انضمام',none_yet:'ما فيه دورات بعد',
enter_name:'اكتب اسمك',joining:'جاري الانضمام...',name_taken:'الاسم مستخدم في هذي الدورة',not_joined:'ما انضميت لأي دورة بعد',
card:(n,m)=>`${n} صفحة يومياً · أنت: ${m}`,goal:n=>`الهدف اليومي: ${n} صفحة`,read_now:'📖 اقرأ الآن',
th_member:'العضو',th_today:'اليوم',th_status:'الحالة',th_total:'مجموع الصفحات',th_missed:'أيام فاتته',done:'خلّص',notdone:'ما خلّص',del_btn:'🗑 حذف الدورة',
del_title:n=>`🗑 حذف «${n}»`,del_warn:'يحذف الكتاب وكل الأعضاء وتقدّمهم نهائياً ولا يمكن الرجوع.',del_confirm:'اكتب اسم الدورة للتأكيد',del_code:'رمز الحذف',cancel:'إلغاء',del_final:'حذف نهائي',
name_mismatch:'الاسم غير مطابق',bad_code:'رمز الحذف خطأ',deleting:'جاري الحذف...',loading_book:'جاري تحميل الكتاب...',back_circle:'← الدورة',today:(a,g)=>`اليوم ${a}/${g}`,
prev:'السابقة →',next:'← التالية',finish:'✔ خلّصت الصفحة',book_done:'🎉 خلّصت الكتاب كله',saving:'جاري الحفظ...',leave_btn:'🚪 مغادرة الدورة',leave_ask:'تبي تغادر هذي الدورة؟ راح يُحذف تقدّمك فيها.',leaving:'جاري المغادرة...',type_word:'اكتب هذي الكلمة للتأكيد',wrong_word:'الكلمة غير مطابقة',only_creator:'فقط منشئ الدورة يقدر يحذفها',
words:['قمر','نخلة','سحابة','وردة','بحر','جبل','نجمة','قلم','كتاب','شمس','ورقة','نهر','صقر','زيتون','ريح','سفينة','قهوة','تمر','ليمون','حديقة']},
en:{title:'Reading Circle',loading:'Loading...',menu_back:'← Menu',create:'Create a circle',join:'Join a circle',mine:'Your circles',lang_btn:'🌐 Language · اللغة',
name_lbl:'Circle name',pages_lbl:'Pages per day',me_lbl:'Your name in the circle',pdf_lbl:'PDF file',code_lbl:"Deletion code (save it, you'll need it to delete the circle)",create_btn:'Create',
fill_all:'Fill in all fields',uploading:'Uploading...',dup:'A circle with this name already exists. Pick another name.',circle_lbl:'Circle',join_btn:'Join',none_yet:'No circles yet',
enter_name:'Enter your name',joining:'Joining...',name_taken:'That name is already taken in this circle',not_joined:"You haven't joined any circle yet",
card:(n,m)=>`${n} pages a day · You: ${m}`,goal:n=>`Daily goal: ${n} pages`,read_now:'📖 Read now',
th_member:'Member',th_today:'Today',th_status:'Status',th_total:'Total pages',th_missed:'Missed days',done:'Done',notdone:'Not yet',del_btn:'🗑 Delete circle',
del_title:n=>`🗑 Delete “${n}”`,del_warn:"This permanently deletes the book, all members and their progress. It can't be undone.",del_confirm:"Type the circle's name to confirm",del_code:'Deletion code',cancel:'Cancel',del_final:'Delete permanently',
name_mismatch:"The name doesn't match",bad_code:'Wrong deletion code',deleting:'Deleting...',loading_book:'Loading the book...',back_circle:'← Circle',today:(a,g)=>`Today ${a}/${g}`,
prev:'← Previous',next:'Next →',finish:'✔ I finished this page',book_done:'🎉 You finished the whole book',saving:'Saving...',leave_btn:'🚪 Leave circle',leave_ask:'Leave this circle? Your progress in it will be deleted.',leaving:'Leaving...',type_word:'Type this word to confirm',wrong_word:"The word doesn't match",only_creator:'Only the creator can delete this circle',
words:['moon','palm','cloud','rose','sea','mountain','star','pen','book','sun','paper','river','falcon','olive','wind','ship','coffee','lemon','tiger','garden']}};
let L=localStorage.lang||'';
const tr=k=>(T[L]||T.ar)[k];
const applyLang=()=>{document.documentElement.lang=L;document.documentElement.dir=L=='en'?'ltr':'rtl';document.title=tr('title')};
function langS(){document.documentElement.dir='rtl';app.innerHTML=`<h1><span class="fl">📖</span> دورة القراءة</h1><p class="mut">اختر اللغة · Choose your language</p><div class="col"><button onclick="setLang('ar')">العربية</button><button onclick="setLang('en')">English</button></div>`}
function setLang(l){L=l;localStorage.lang=l;applyLang();menu()}
const back=()=>`<button class="ghost" onclick="menu()">${tr('menu_back')}</button>`;

/* ---------- storage (via Worker -> your GitHub repo) ---------- */
const api=p=>`${WORKER}/${p}`;
const H=raw=>({Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'});
const q=()=>`?t=${Date.now()}`;
async function getRaw(p){const r=await fetch(api(p)+q(),{headers:H(1)});if(r.status==404)return null;if(!r.ok)throw new Error('Server '+r.status);return r}
async function list(p){const r=await fetch(api(p)+q(),{headers:H()});if(r.status==404)return[];if(!r.ok)throw new Error('Server '+r.status);return r.json()}
async function put(p,b64,msg,retry=1){
  let sha;const g=await fetch(api(p)+q(),{headers:H()});if(g.ok)sha=(await g.json()).sha;
  const w=await fetch(api(p),{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64,sha})});
  if(!w.ok){if(retry&&w.status==409)return put(p,b64,msg,0);throw new Error((await w.json()).message||('Server '+w.status))}
}
const saveMember=(d,m)=>put(d+'/members/'+slug(m.name)+'.json',enc(JSON.stringify(m)),'update '+m.name);

const hash=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function del(p,sh){
  const r=await fetch(api(p),{method:'DELETE',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({message:'delete '+p,sha:sh})});
  if(!r.ok)throw new Error((await r.json()).message||'Server '+r.status);
}
async function delS(d){
  const c=await(await getRaw(d+'/config.json')).json();
  const mo=document.createElement('div');mo.className='mod';
  mo.innerHTML=`<div class="box"><h2>${tr('del_title')(esc(c.name))}</h2><p class="mut">${tr('del_warn')}</p>
<label>${tr('del_confirm')}</label><input id="cn">${c.del?`<label>${tr('del_code')}</label><input id="cc" type="password">`:''}
<div class="bar"><button class="ghost" onclick="this.closest('.mod').remove()">${tr('cancel')}</button><button class="danger" id="dgo">${tr('del_final')}</button></div></div>`;
  document.body.appendChild(mo);
  $('#dgo').onclick=async()=>{
    if($('#cn').value.trim().toLowerCase()!==c.name.trim().toLowerCase())return alert(tr('name_mismatch'));
    if(c.del&&await hash($('#cc').value.trim())!==c.del)return alert(tr('bad_code'));
    const b=$('#dgo');b.disabled=true;b.textContent=tr('deleting');
    try{
      for(const x of await list(d+'/members'))await del(x.path,x.sha);
      for(const x of(await list(d)).filter(x=>x.type=='file'&&x.name!='config.json'))await del(x.path,x.sha);
      const cf=(await list(d)).find(x=>x.name=='config.json');if(cf)await del(cf.path,cf.sha);
      localStorage.mine=JSON.stringify(mine().filter(x=>x.d!==d));
      mo.remove();menu();
    }catch(e){alert(e.message);b.disabled=false;b.textContent=tr('del_final')}
  };
}
async function leave(d){
  const me=mine().find(x=>x.d==d);if(!me)return;
  if(!confirm(tr('leave_ask')))return;
  busy(tr('leaving'));
  try{
    const f=(await list(d+'/members')).find(x=>x.name==slug(me.n)+'.json');
    if(f)await del(f.path,f.sha);
    localStorage.mine=JSON.stringify(mine().filter(x=>x.d!==d));
    menu();
  }catch(e){alert(e.message);openD(d)}
}

/* ---------- screens ---------- */
function menu(){app.innerHTML=`<h1><span class="fl">📖</span> ${tr('title')}</h1><div class="col">
<button onclick="createS()">${tr('create')}</button>
<button onclick="joinS()">${tr('join')}</button>
<button onclick="mineS()">${tr('mine')}</button>
<button class="ghost" onclick="langS()">${tr('lang_btn')}</button></div>`}

function createS(){app.innerHTML=`${back()}<h2>${tr('create')}</h2><div class="col">
<div><label>${tr('name_lbl')}</label><input id="dn"></div>
<div><label>${tr('pages_lbl')}</label><input id="pp" type="number" min="1" value="20"></div>
<div><label>${tr('me_lbl')}</label><input id="me"></div>
<div><label>${tr('pdf_lbl')}</label><input id="pdf" type="file" accept="application/pdf"></div>
<div><label>${tr('code_lbl')}</label><input id="dc" type="password"></div>
<button id="go" onclick="doCreate()">${tr('create_btn')}</button></div>`}
async function doCreate(){
  const name=$('#dn').value.trim(),n=+$('#pp').value,me=$('#me').value.trim(),f=$('#pdf').files[0],code=$('#dc').value.trim();
  if(!name||!me||!f||n<1||!code)return alert(tr('fill_all'));
  
  const b=$('#go');b.disabled=true;b.textContent=tr('uploading');
  try{
    const d='dawras/'+slug(name);
    if(await getRaw(d+'/config.json'))throw new Error(tr('dup'));
    await put(d+'/book.pdf',await b64file(f),'add book: '+name);
    const t=ymd(new Date());
    await put(d+'/config.json',enc(JSON.stringify({name,perDay:n,start:t,del:await hash(code)})),'create dawra: '+name);
    await saveMember(d,{name:me,joined:t,last:0,days:{}});
    remember(d,me);openD(d);
  }catch(e){alert(e.message);b.disabled=false;b.textContent=tr('create_btn')}
}

async function joinS(){
  busy();
  try{
    const ds=(await list('dawras')).filter(x=>x.type=='dir');
    const cs=await Promise.all(ds.map(async x=>{const r=await getRaw(x.path+'/config.json');return r?{d:x.path,c:await r.json()}:null}));
    const ok=cs.filter(Boolean);
    app.innerHTML=`${back()}<h2>${tr('join')}</h2>`+(ok.length?`<div class="col">
<div><label>${tr('circle_lbl')}</label><select id="ds">${ok.map(x=>`<option value="${x.d}">${esc(x.c.name)}</option>`).join('')}</select></div>
<div><label>${tr('me_lbl')}</label><input id="me"></div>
<button onclick="doJoin()">${tr('join_btn')}</button></div>`:`<p class="mut">${tr('none_yet')}</p>`);
  }catch(e){alert(e.message);menu()}
}
async function doJoin(){
  const d=$('#ds').value,me=$('#me').value.trim();
  if(!me)return alert(tr('enter_name'));
  busy(tr('joining'));
  try{
    const exists=await getRaw(d+'/members/'+slug(me)+'.json');
    const mineHere=mine().some(x=>x.d==d&&x.n.toLowerCase()==me.toLowerCase());
    if(exists&&!mineHere)throw new Error(tr('name_taken'));
    if(!exists)await saveMember(d,{name:me,joined:ymd(new Date()),last:0,days:{}});
    remember(d,me);openD(d);
  }catch(e){alert(e.message);joinS()}
}

async function mineS(){
  const l=mine();
  if(!l.length){app.innerHTML=`${back()}<h2>${tr('mine')}</h2><p class="mut">${tr('not_joined')}</p>`;return}
  busy();
  const cs=await Promise.all(l.map(async x=>{try{const r=await getRaw(x.d+'/config.json');return r?{...x,c:await r.json()}:null}catch(e){return null}}));
  app.innerHTML=`${back()}<h2>${tr('mine')}</h2><div class="col">${cs.filter(Boolean).map(x=>`<div class="card" onclick="openD('${x.d}')"><b>${esc(x.c.name)}</b><div class="mut">${tr('card')(x.c.perDay,esc(x.n))}</div></div>`).join('')}</div>`;
}

function missed(m,c){
  const s=(m.joined>c.start?m.joined:c.start).split('-'),today=new Date();today.setHours(0,0,0,0);
  let n=0;for(const x=new Date(+s[0],s[1]-1,+s[2]);x<today;x.setDate(x.getDate()+1))if((m.days[ymd(x)]||0)<c.perDay)n++;
  return n;
}
async function openD(d){
  busy();
  try{
    const c=await(await getRaw(d+'/config.json')).json();
    const ms=await Promise.all((await list(d+'/members')).filter(x=>x.name.endsWith('.json')).map(async x=>(await getRaw(x.path)).json()));
    const t=ymd(new Date()),me=mine().find(x=>x.d==d);
    ms.sort((a,b)=>b.last-a.last);
    app.innerHTML=`${back()}<h2>${esc(c.name)}</h2><p class="mut">${tr('goal')(c.perDay)}</p>
${me?`<div class="col"><button onclick="read('${d}')">${tr('read_now')}</button></div>`:''}
<div class="wrap"><table><tr><th>${tr('th_member')}</th><th>${tr('th_today')}</th><th>${tr('th_status')}</th><th>${tr('th_total')}</th><th>${tr('th_missed')}</th></tr>
${ms.map((m,i)=>{const td=m.days[t]||0,ok=td>=c.perDay,ms_=missed(m,c);
return `<tr style="animation-delay:${i*.08}s"><td>${esc(m.name)}</td><td>${td}/${c.perDay}<div class="pb"><i style="width:${Math.min(100,td/c.perDay*100)}%"></i></div></td><td>${ok?`<span class="ok">✅</span> ${tr('done')}`:`❌ ${tr('notdone')}`}</td><td>${m.last}</td><td class="${ms_?'bad':''}">${ms_}</td></tr>`}).join('')}</table></div><div class="col">${me?`<button class="ghost" onclick="leave('${d}')">${tr('leave_btn')}</button>`:''}<button class="ghost danger" onclick="delS('${d}')">${tr('del_btn')}</button></div>`;
  }catch(e){alert(e.message);menu()}
}

/* ---------- reader ---------- */
let pdf,m,c,d,view;
async function read(dd){
  d=dd;busy(tr('loading_book'));
  try{
    const me=mine().find(x=>x.d==d);
    c=await(await getRaw(d+'/config.json')).json();
    m=await(await getRaw(d+'/members/'+slug(me.n)+'.json')).json();
    pdf=await pdfjsLib.getDocument({data:await(await getRaw(d+'/book.pdf')).arrayBuffer()}).promise;
    view=Math.min(m.last+1,pdf.numPages);ui();
  }catch(e){alert(e.message);openD(d)}
}
function ui(){
  const t=ymd(new Date()),td=m.days[t]||0,done=m.last>=pdf.numPages;
  app.innerHTML=`<div class="bar"><button class="ghost" onclick="openD(d)">${tr('back_circle')}</button><b>${tr('today')(td,c.perDay)} ${td>=c.perDay?'✅':''}</b></div>
<div class="cv"><canvas id="cv"></canvas></div>
<div class="bar"><button class="ghost" onclick="nav(-1)" ${view<=1?'disabled':''}>${tr('prev')}</button><span>${view} / ${pdf.numPages}</span><button class="ghost" onclick="nav(1)" ${view>m.last||view>=pdf.numPages?'disabled':''}>${tr('next')}</button></div>
<div class="col">${view>m.last?`<button id="fin" onclick="fin()">${tr('finish')}</button>`:done&&view==pdf.numPages?`<p class="mut">${tr('book_done')}</p>`:''}</div>`;
  show();
}
async function show(){
  const p=await pdf.getPage(view),w=Math.min(app.clientWidth-8,900),s=w/p.getViewport({scale:1}).width,dpr=window.devicePixelRatio||1;
  const vp=p.getViewport({scale:s*dpr}),cv=$('#cv');
  cv.width=vp.width;cv.height=vp.height;cv.style.width=w+'px';
  await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
}
function nav(x){view+=x;ui();scrollTo(0,0)}
async function fin(){
  const b=$('#fin');b.disabled=true;b.textContent=tr('saving');
  const t=ymd(new Date());
  m.days[t]=(m.days[t]||0)+1;m.last=view;
  try{await saveMember(d,m)}catch(e){alert(e.message);m.days[t]--;m.last=view-1;return ui()}
  if(view<pdf.numPages)view++;ui();scrollTo(0,0);
}
if(L){applyLang();menu()}else langS();
</script>
