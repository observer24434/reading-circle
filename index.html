/* ---------- storage (via Worker -> your GitHub repo) ---------- */
const api=p=>`${WORKER}/${p}`;
const H=raw=>({Accept:raw?'application/vnd.github.raw+json':'application/vnd.github+json'});
const q=()=>`?t=${Date.now()}`;
async function getRaw(p){const r=await fetch(api(p)+q(),{headers:H(1)});if(r.status==404)return null;if(!r.ok)throw new Error('Server '+r.status);return r}
async function list(p){const r=await fetch(api(p)+q(),{headers:H()});if(r.status==404)return[];if(!r.ok)throw new Error('Server '+r.status);return r.json()}
async function put(p,b64,msg,retry=1){
  let sha;const g=await fetch(api(p)+q(),{headers:H()});if(g.ok)sha=(await g.json()).sha;
  const w=await fetch(api(p),{method:'PUT',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64,sha})});
  if(!w.ok){if(retry&&w.status==409)return put(p,b64,msg,0);throw new Error((await w.json()).message||('Server '+w.status))}
}
const saveMember=(d,m)=>put(d+'/members/'+slug(m.name)+'.json',enc(JSON.stringify(m)),'update '+m.name);

const hash=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function del(p,sh){
  const r=await fetch(api(p),{method:'DELETE',headers:{...H(),'Content-Type':'application/json'},body:JSON.stringify({message:'delete '+p,sha:sh})});
  if(!r.ok)throw new Error((await r.json()).message||'Server '+r.status);
}
async function delS(d){
  const c=await(await getRaw(d+'/config.json')).json();
  const mo=document.createElement('div');mo.className='mod';
  mo.innerHTML=`<div class="box"><h2>${tr('del_title')(esc(c.name))}</h2><p class="mut">${tr('del_warn')}</p>
<label>${tr('del_confirm')}</label><input id="cn">${c.del?`<label>${tr('del_code')}</label><input id="cc" type="password">`:''}
<div class="bar"><button class="ghost" onclick="this.closest('.mod').remove()">${tr('cancel')}</button><button class="danger" id="dgo">${tr('del_final')}</button></div></div>`;
  document.body.appendChild(mo);
  $('#dgo').onclick=async()=>{
    if($('#cn').value.trim().toLowerCase()!==c.name.trim().toLowerCase())return alert(tr('name_mismatch'));
    if(c.del&&await hash($('#cc').value.trim())!==c.del)return alert(tr('bad_code'));
    const b=$('#dgo');b.disabled=true;b.textContent=tr('deleting');
    try{
      for(const x of await list(d+'/members'))await del(x.path,x.sha);
      for(const x of(await list(d)).filter(x=>x.type=='file'&&x.name!='config.json'))await del(x.path,x.sha);
      const cf=(await list(d)).find(x=>x.name=='config.json');if(cf)await del(cf.path,cf.sha);
      setMine(mine().filter(x=>x.d!==d));
      mo.remove();menu();
    }catch(e){alert(e.message);b.disabled=false;b.textContent=tr('del_final')}
  };
}
async function leave(d){
  const me=mine().find(x=>x.d==d);if(!me)return;
  if(!confirm(tr('leave_ask')))return;
  busy(tr('leaving'));
  try{
    const f=(await list(d+'/members')).find(x=>x.name==slug(me.n)+'.json');
    if(f)await del(f.path,f.sha);
    setMine(mine().filter(x=>x.d!==d));
    menu();
  }catch(e){alert(e.message);openD(d)}
}

const WORDS="apple arrow bakery beach berry bird boat book bridge brush cabin camel candle canyon carpet castle cedar cherry circle cliff cloud clover coast coffee comet copper coral cotton crane crystal daisy delta desert diamond dolphin dragon dream eagle ember falcon feather fern field flame forest fountain garden ginger glacier goat golden grape harbor hazel heron honey island ivory jasmine jungle kettle kite lagoon lantern lemon lily lotus maple marble meadow melon mint mirror moon moss mountain nectar ocean olive orange orchid otter palm panda pearl pebble pepper pine planet plum pond poppy quartz rabbit rain raven reef ribbon river robin rocket rose saffron sage sand shell silver sketch snow spark spice spring star stone storm sugar summer sunset swan tea thunder tiger timber tulip turtle valley velvet violet walnut water willow wind winter wolf yarrow zebra acorn amber anchor aspen basil bamboo beacon birch blossom breeze cactus canoe cocoa cricket dune echo elm fable fjord flint frost galaxy gecko harvest hawk iris jade juniper kelp koala lark lava lilac lynx mango mesa mist nest oasis onyx opal orbit owl peach pixel prairie pumpkin quill quail radish ridge sable salmon seed sierra sparrow spruce steam sunrise thistle thorn tundra vine wave wheat zephyr almond apricot arctic autumn badger barley bison blizzard bronze butter cashew chestnut cinnamon clementine cobalt cranberry cypress dandelion dusk emerald fennel firefly flamingo garnet hickory indigo lavender magnolia marigold nutmeg orchard paprika peacock pistachio raspberry rosemary sapphire tangerine truffle vanilla violin cider clay dawn dove drift fox frog hill ink lake leaf lime oak".split(' ');
const b2h=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const h2b=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
const rw=()=>[...crypto.getRandomValues(new Uint8Array(6))].map(x=>WORDS[x]).join('-');
const normW=v=>{const a=String(v).toLowerCase().split(/[^a-z]+/).filter(Boolean);return a.length==6&&a.every(x=>WORDS.includes(x))?a.join('-'):''};
async function derive(w){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(w),'PBKDF2',false,['deriveBits']);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode('dawra-sync-v1'),iterations:200000,hash:'SHA-256'},km,512));
  return {id:b2h(bits.slice(0,32)),key:await crypto.subtle.importKey('raw',bits.slice(32),'AES-GCM',false,['encrypt','decrypt'])};
}
async function rmFile(p){const g=await fetch(api(p)+q(),{headers:H()});if(g.ok)await del(p,(await g.json()).sha)}
const acctPath=async()=>'dawras/_acct/'+await hash('acct:'+localStorage.acct)+'.json';
async function pushMine(){if(!localStorage.acct)return;await put(await acctPath(),enc(JSON.stringify({mine:mine()})),'sync')}
async function pullMine(merge){
  if(!localStorage.acct)return;
  const r=await getRaw(await acctPath());if(!r)return;
  let rem=[];try{rem=(await r.json()).mine||[]}catch(e){}
  if(merge){const have=new Set(rem.map(x=>x.d));for(const x of mine())if(!have.has(x.d))rem.push(x)}
  localStorage.mine=JSON.stringify(rem);
}
async function linkWith(w){
  const {id,key}=await derive(w),p='dawras/_sync/'+id+'.json';
  const r=await getRaw(p);if(!r)throw new Error(tr('bad_code2'));
  const j=await r.json();
  if(Date.now()>j.exp){await rmFile(p).catch(()=>{});throw new Error(tr('code_expired'))}
  let S;try{S=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:h2b(j.iv)},key,h2b(j.ct)))}catch(e){throw new Error(tr('bad_code2'))}
  localStorage.acct=S;
  await pullMine(true);await pushMine();
  await rmFile(p).catch(()=>{});
}
let curCode='';
function leaveSync(){if(curCode){rmFile(curCode).catch(()=>{});curCode=''}menu()}
function syncS(){app.innerHTML=`${back()}<h2>${tr('sync_title')}</h2><div class="col"><button onclick="syncShow()">${tr('sync_show_btn')}</button><button onclick="syncHave()">${tr('sync_have_btn')}</button></div>`}
function syncHave(){app.innerHTML=`<button class="ghost" onclick="syncS()">${tr('menu_back')}</button><h2>${tr('sync_title')}</h2><div class="col"><input id="wc" dir="ltr" autocomplete="off" autocapitalize="off" oninput="this.value=this.value.toLowerCase().replace(/[^a-z]+/g,'-')" placeholder="word-word-word-word-word-word"><button id="lb" onclick="doLink()">${tr('link_btn')}</button></div>`}
async function doLink(){
  const w=normW($('#wc').value);if(!w)return alert(tr('bad_code2'));
  const b=$('#lb');b.disabled=true;b.textContent=tr('syncing');
  try{await linkWith(w);alert(tr('linked_ok'));menu()}catch(e){alert(e.message);b.disabled=false;b.textContent=tr('link_btn')}
}
async function syncShow(){
  busy(tr('syncing'));
  try{
    if(!localStorage.acct)localStorage.acct=b2h(crypto.getRandomValues(new Uint8Array(16)));
    await pushMine();
    const w=rw(),{id,key}=await derive(w),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(localStorage.acct));
    const p='dawras/_sync/'+id+'.json';
    await put(p,enc(JSON.stringify({iv:b2h(iv),ct:b2h(ct),exp:Date.now()+600000})),'sync code');
    curCode=p;
    const link=location.origin+location.pathname+'#sync='+w;
    app.innerHTML=`<button class="ghost" onclick="leaveSync()">${tr('menu_back')}</button><h2>${tr('sync_title')}</h2><p class="mut">${tr('sync_info')}</p>
<div id="synccode" dir="ltr" style="text-align:center;font-size:22px;font-weight:700;color:#00e0c0;margin:12px 0;line-height:1.6;overflow-wrap:anywhere">${w}</div>
<div style="text-align:center"><div id="qr" style="background:#fff;padding:12px;border-radius:12px;display:inline-block"></div></div>
<p class="mut">${tr('sync_note')}</p>`;
    if(window.QRCode)new QRCode($('#qr'),{text:link,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
    else $('#qr').outerHTML=`<p class="mut" dir="ltr">${tr('qr_fallback')} ${link}</p>`;
    const t0=Date.now(),tm=setInterval(async()=>{
      if(!$('#synccode')){clearInterval(tm);return}
      if(Date.now()-t0>600000){clearInterval(tm);rmFile(p).catch(()=>{});return}
      try{if(!await getRaw(p)){clearInterval(tm);curCode='';app.innerHTML=`${back()}<h2>${tr('linked_ok')}</h2>`}}catch(e){}
    },5000);
  }catch(e){alert(e.message);syncS()}
}

/* ---------- fun: background, mascot, confetti ---------- */
const calm=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
function toast(x){const e=document.createElement('div');e.className='toast';e.textContent=x;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function burst(x,y,n=14){
  if(calm())return;const set=['⭐','✨','💜','🎉','📖','💚'];
  for(let i=0;i<n;i++){const e=document.createElement('span');e.textContent=set[i%set.length];
    e.style.cssText=`position:fixed;left:${x}px;top:${y}px;font-size:${14+Math.random()*16}px;pointer-events:none;z-index:50`;
    document.body.appendChild(e);const a=Math.random()*Math.PI*2,r=60+Math.random()*120;
    e.animate([{transform:'translate(-50%,-50%) scale(.3)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*r}px),calc(-50% + ${Math.sin(a)*r+60}px)) rotate(${Math.random()*360}deg) scale(1)`,opacity:0}],{duration:900+Math.random()*500,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>e.remove()}
}
function rain(){
  if(calm())return;const set=['⭐','✨','🎉','💜','💚','🎊'];
  for(let i=0;i<34;i++){const e=document.createElement('span');e.textContent=set[i%set.length];
    e.style.cssText=`position:fixed;top:-30px;left:${Math.random()*100}vw;font-size:${16+Math.random()*18}px;pointer-events:none;z-index:50`;
    document.body.appendChild(e);
    e.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${innerHeight+60}px) rotate(${Math.random()*720-360}deg)`,opacity:.9}],{duration:1800+Math.random()*1600,delay:Math.random()*700,easing:'cubic-bezier(.3,.2,.6,1)',fill:'backwards'}).onfinish=()=>e.remove()}
}
function makeBg(){
  const bg=document.createElement('div');bg.id='bg';
  const ch=['⭐','✨','☁️','🌙','📖','✏️','💜','🪐','📚','🔖','🍃','🫧','🎈','🦋'];
  for(let i=0;i<20;i++){const e=document.createElement('span');e.textContent=ch[i%ch.length];
    const an=`dfloat ${6+Math.random()*7}s ease-in-out ${-Math.random()*8}s infinite alternate`;
    e.style.cssText=`left:${Math.random()*96}%;top:${Math.random()*94}%;font-size:${22+Math.random()*30}px;opacity:${.16+Math.random()*.14};--d:${6+Math.random()*22};--r1:${-14+Math.random()*10}deg;--r2:${4+Math.random()*12}deg;animation:${an}`;
    e.dataset.a=an;
    e.onclick=ev=>{e.style.animation='dpop .5s forwards';burst(ev.clientX,ev.clientY,8);setTimeout(()=>{e.style.animation=e.dataset.a},4000)};
    bg.appendChild(e)}
  document.body.prepend(bg);
  addEventListener('pointermove',ev=>{
    const st=document.documentElement.style;st.setProperty('--mx',(ev.clientX/innerWidth-.5)*2);st.setProperty('--my',(ev.clientY/innerHeight-.5)*2);
    const ms=$('#mas');if(ms){const r=ms.getBoundingClientRect(),dx=ev.clientX-(r.left+r.width/2),dy=ev.clientY-(r.top+r.height/2),k=Math.min(1,Math.hypot(dx,dy)/200)*5,an=Math.atan2(dy,dx);
      ms.querySelectorAll('.pp').forEach(p=>p.style.transform=`translate(${Math.cos(an)*k}px,${Math.sin(an)*k}px)`)}});
}
const mascot=()=>`<svg id="mas" viewBox="0 0 160 140" width="150" onclick="mascotTap(event)" role="img" aria-label="mascot"><g class="mb">
<path d="M80 40 Q45 25 12 40 V112 Q45 98 80 112 Z" fill="#b7a6f5" stroke="#7f6fd0" stroke-width="4" stroke-linejoin="round"/>
<path d="M80 40 Q115 25 148 40 V112 Q115 98 80 112 Z" fill="#8fdcc4" stroke="#5fb9a0" stroke-width="4" stroke-linejoin="round"/>
<g class="eye"><circle cx="58" cy="70" r="13" fill="#fff"/><circle class="pp" cx="58" cy="70" r="6" fill="#2a2740"/></g>
<g class="eye"><circle cx="102" cy="70" r="13" fill="#fff"/><circle class="pp" cx="102" cy="70" r="6" fill="#2a2740"/></g>
<path d="M68 90 Q80 102 92 90" fill="none" stroke="#2a2740" stroke-width="4" stroke-linecap="round"/>
<circle cx="38" cy="88" r="6" fill="#ffc9a8" opacity=".85"/><circle cx="122" cy="88" r="6" fill="#ffc9a8" opacity=".85"/></g></svg>`;
function mascotTap(ev){
  const m=$('#mas'),b=$('#bub'),l=(T[L]||T.ar).say;
  m.classList.remove('jump');void m.getBoundingClientRect();m.classList.add('jump');
  b.innerHTML=`<span class="bub">${l[Math.floor(Math.random()*l.length)]}</span>`;
  burst(ev.clientX,ev.clientY,8);clearTimeout(window.bt);window.bt=setTimeout(()=>{b.innerHTML=''},2400);
}

/* ---------- screens ---------- */
function menu(){app.innerHTML=`<div class="mw"><div id="bub" class="bubw"></div>${mascot()}</div><h1>${tr('title')}</h1><div class="col">
<button onclick="createS()">${tr('create')}</button>
<button onclick="joinS()">${tr('join')}</button>
<button onclick="mineS()">${tr('mine')}</button>
<button class="ghost" onclick="syncS()">${tr('sync_btn')}</button>
<button class="ghost" onclick="langS()">${tr('lang_btn')}</button></div>`}

function createS(){app.innerHTML=`${back()}<h2>${tr('create')}</h2><div class="col">
<div><label>${tr('name_lbl')}</label><input id="dn"></div>
<div><label>${tr('pages_lbl')}</label><input id="pp" type="number" min="1" value="20"></div>
<div><label>${tr('me_lbl')}</label><input id="me"></div>
<div><label>${tr('pdf_lbl')}</label><input id="pdf" type="file" accept="application/pdf"></div>
<div><label>${tr('code_lbl')}</label><input id="dc" type="password"></div>
<button id="go" onclick="doCreate()">${tr('create_btn')}</button></div>`}
async function doCreate(){
  const name=$('#dn').value.trim(),n=+$('#pp').value,me=$('#me').value.trim(),f=$('#pdf').files[0],code=$('#dc').value.trim();
  if(!name||!me||!f||n<1||!code)return alert(tr('fill_all'));
  
  const b=$('#go');b.disabled=true;b.textContent=tr('uploading');
  try{
    const d='dawras/'+slug(name);
    if(await getRaw(d+'/config.json'))throw new Error(tr('dup'));
    await put(d+'/book.pdf',await b64file(f),'add book: '+name);
    const t=ymd(new Date());
    await put(d+'/config.json',enc(JSON.stringify({name,perDay:n,start:t,del:await hash(code)})),'create dawra: '+name);
    await saveMember(d,{name:me,joined:t,last:0,days:{}});
    remember(d,me);openD(d);
  }catch(e){alert(e.message);b.disabled=false;b.textContent=tr('create_btn')}
}

async function joinS(){
  busy();
  try{
    const ds=(await list('dawras')).filter(x=>x.type=='dir'&&!x.name.startsWith('_'));
    const cs=await Promise.all(ds.map(async x=>{const r=await getRaw(x.path+'/config.json');return r?{d:x.path,c:await r.json()}:null}));
    const ok=cs.filter(Boolean);
    app.innerHTML=`${back()}<h2>${tr('join')}</h2>`+(ok.length?`<div class="col">
<div><label>${tr('circle_lbl')}</label><select id="ds">${ok.map(x=>`<option value="${x.d}">${esc(x.c.name)}</option>`).join('')}</select></div>
<div><label>${tr('me_lbl')}</label><input id="me"></div>
<button onclick="doJoin()">${tr('join_btn')}</button></div>`:`<p class="mut">${tr('none_yet')}</p>`);
  }catch(e){alert(e.message);menu()}
}
async function doJoin(){
  const d=$('#ds').value,me=$('#me').value.trim();
  if(!me)return alert(tr('enter_name'));
  if(localStorage.acct){try{await pullMine(false)}catch(e){}}
  if(mine().some(x=>x.d==d)){alert(tr('already_joined'));return openD(d)}
  busy(tr('joining'));
  try{
    const exists=await getRaw(d+'/members/'+slug(me)+'.json');
    const mineHere=mine().some(x=>x.d==d&&x.n.toLowerCase()==me.toLowerCase());
    if(exists&&!mineHere)throw new Error(tr('name_taken'));
    if(!exists)await saveMember(d,{name:me,joined:ymd(new Date()),last:0,days:{}});
    remember(d,me);openD(d);
  }catch(e){alert(e.message);joinS()}
}

async function mineS(){
  if(localStorage.acct){try{await pullMine(false)}catch(e){}}
  const l=mine();
  if(!l.length){app.innerHTML=`${back()}<h2>${tr('mine')}</h2><p class="mut">${tr('not_joined')}</p>`;return}
  busy();
  const cs=await Promise.all(l.map(async x=>{try{const r=await getRaw(x.d+'/config.json');return r?{...x,c:await r.json()}:null}catch(e){return null}}));
  app.innerHTML=`${back()}<h2>${tr('mine')}</h2><div class="col">${cs.filter(Boolean).map(x=>`<div class="card" onclick="openD('${x.d}')"><b>${esc(x.c.name)}</b><div class="mut">${tr('card')(x.c.perDay,esc(x.n))}</div></div>`).join('')}</div>`;
}

function missed(m,c){
  const s=(m.joined>c.start?m.joined:c.start).split('-'),today=new Date();today.setHours(0,0,0,0);
  let n=0;for(const x=new Date(+s[0],s[1]-1,+s[2]);x<today;x.setDate(x.getDate()+1))if((m.days[ymd(x)]||0)<c.perDay)n++;
  return n;
}
async function openD(d){
  busy();
  try{
    const c=await(await getRaw(d+'/config.json')).json();
    const ms=await Promise.all((await list(d+'/members')).filter(x=>x.name.endsWith('.json')).map(async x=>(await getRaw(x.path)).json()));
    const t=ymd(new Date()),me=mine().find(x=>x.d==d);
    ms.sort((a,b)=>b.last-a.last);
    app.innerHTML=`${back()}<h2>${esc(c.name)}</h2><p class="mut">${tr('goal')(c.perDay)}</p>
${me?`<div class="col"><button onclick="read('${d}')">${tr('read_now')}</button></div>`:''}
<div class="wrap"><table><tr><th>${tr('th_member')}</th><th>${tr('th_today')}</th><th>${tr('th_status')}</th><th>${tr('th_total')}</th><th>${tr('th_missed')}</th></tr>
${ms.map((m,i)=>{const td=m.days[t]||0,ok=td>=c.perDay,ms_=missed(m,c);
return `<tr style="animation-delay:${i*.08}s"><td>${esc(m.name)}</td><td>${td}/${c.perDay}<div class="pb"><i style="width:${Math.min(100,td/c.perDay*100)}%"></i><b class="wk" style="inset-inline-start:calc(${Math.min(100,td/c.perDay*100)}% - 9px)">${td>=c.perDay?'⭐':td>0?'🏃':'😴'}</b></div></td><td>${ok?`<span class="ok">✅</span> ${tr('done')}`:`❌ ${tr('notdone')}`}</td><td>${m.last}</td><td class="${ms_?'bad':''}">${ms_}</td></tr>`}).join('')}</table></div><div class="col">${me?`<button class="ghost" onclick="leave('${d}')">${tr('leave_btn')}</button>`:''}<button class="ghost danger" onclick="delS('${d}')">${tr('del_btn')}</button></div>`;
  }catch(e){alert(e.message);menu()}
}

/* ---------- reader ---------- */
let pdf,m,c,d,view,flipF=false;
async function read(dd){
  d=dd;busy(tr('loading_book'));
  try{
    const me=mine().find(x=>x.d==d);
    c=await(await getRaw(d+'/config.json')).json();
    m=await(await getRaw(d+'/members/'+slug(me.n)+'.json')).json();
    pdf=await pdfjsLib.getDocument({data:await(await getRaw(d+'/book.pdf')).arrayBuffer()}).promise;
    view=Math.min(m.last+1,pdf.numPages);ui();
  }catch(e){alert(e.message);openD(d)}
}
function ui(){
  const t=ymd(new Date()),td=m.days[t]||0,done=m.last>=pdf.numPages;
  app.innerHTML=`<div class="bar"><button class="ghost" onclick="openD(d)">${tr('back_circle')}</button><b>${tr('today')(td,c.perDay)} ${td>=c.perDay?'✅':''}</b></div>
<div class="cv"><canvas id="cv"></canvas></div>
<div class="bar"><button class="ghost" onclick="nav(-1)" ${view<=1?'disabled':''}>${tr('prev')}</button><span>${view} / ${pdf.numPages}</span><button class="ghost" onclick="nav(1)" ${view>m.last||view>=pdf.numPages?'disabled':''}>${tr('next')}</button></div>
<div class="col">${view>m.last?`<button id="fin" onclick="fin()">${tr('finish')}</button>`:done&&view==pdf.numPages?`<p class="mut">${tr('book_done')}</p>`:''}</div>`;
  show();
}
async function show(){
  const p=await pdf.getPage(view),w=Math.min(app.clientWidth-8,900),s=w/p.getViewport({scale:1}).width,dpr=window.devicePixelRatio||1;
  const vp=p.getViewport({scale:s*dpr}),cv=$('#cv');
  cv.width=vp.width;cv.height=vp.height;cv.style.width=w+'px';
  if(flipF){cv.classList.add('flip');flipF=false}
  await p.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
}
function nav(x){view+=x;flipF=true;ui();scrollTo(0,0)}
async function fin(){
  const b=$('#fin'),r=b.getBoundingClientRect();b.disabled=true;b.textContent=tr('saving');
  const t=ymd(new Date());
  m.days[t]=(m.days[t]||0)+1;m.last=view;
  try{await saveMember(d,m)}catch(e){alert(e.message);m.days[t]--;m.last=view-1;return ui()}
  burst(r.left+r.width/2,r.top+r.height/2,12);
  if(view<pdf.numPages)view++;flipF=true;ui();scrollTo(0,0);
  if(m.days[t]==c.perDay){rain();toast(tr('goal_done'))}
}
(async()=>{
  makeBg();
  const hs=/#sync=([a-z-]+)/.exec(location.hash);
  if(L)applyLang();
  if(hs){history.replaceState(null,'',location.pathname+location.search);const w=normW(hs[1]);
    if(w){busy(tr('syncing'));try{await linkWith(w);alert(tr('linked_ok'))}catch(e){alert(e.message)}}}
  else if(localStorage.acct){try{await pullMine(false)}catch(e){}}
  L?menu():langS();
})();
